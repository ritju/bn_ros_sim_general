amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.01
    alpha2: 0.01
    alpha3: 0.01
    alpha4: 0.01
    alpha5: 0.01
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 1.0
    laser_max_range: 40.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 100
    max_particles: 800
    min_particles: 200
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 3
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.12
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.3
    update_min_d: 0.25
    z_hit: 0.7
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05
    scan_topic: /front_scan

slam_toolbox:
  ros__parameters:
    # 注意：tb3_simulation_launch.py 的 slam 默认 False，本块当前不会被加载
    # （slam_launch.py 只在 slam:=True 时启动 slam_toolbox，而它会与
    # fake_sensor_publisher 争抢 map->odom）。
    # 另：mode: mapping 与下面的 map_file_name / map_start_at_dock 语义冲突，
    # 后两者只在 localization 模式下有效。此块保留仅作备用。
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan_lidar3d
    use_map_saver: true
    mode: mapping #localization

    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive, if pose is given
    # will use pose
    map_file_name: bn_sim_new
    #map_start_pose: [0.0, 0.0, 0.0]
    #map_start_at_dock: false

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02 #if 0 never publishes odometry
    map_update_interval: 1.0
    resolution: 0.05
    min_laser_range: 0.75 # 与 /scan_lidar3d 的 range_min 一致，去掉车身回波
    max_laser_range: 10.0 #for rastering images
    # 0.5 → 0.25：扫描处理更及时（10 Hz 扫描下约每 2~3 帧处理一次）
    minimum_time_interval: 0.25
    transform_timeout: 0.2
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000 #// program needs a larger stack size to serialize large maps
    enable_interactive_mode: true

    # General Parameters
    # odom 为地面真值（gazebo WORLD 源），扫描匹配反而引入累积偏置
    # （长跑后 yaw 偏 ~5°、位置偏 ~0.5 m，量级与匹配门限 0.3~0.55 无关）。
    # 建图时关闭匹配，地图直接按真值 odom 拓印 → 漂移归零。
    use_scan_matching: false
    use_scan_barycenter: true
    # 转向跳变的根因：0.5 rad(28.6°) 才触发一次更新，转向时扫描攒批爆发。
    # 调小后每 ~5.7° 处理一帧，转向平滑跟随。
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.1
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.3
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.55

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1

